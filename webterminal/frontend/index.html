<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Server Terminal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--tg-theme-bg-color, #0e0e0e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #statusbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--tg-theme-secondary-bg-color, #181818);
    color: var(--tg-theme-hint-color, #888);
    font-size: 13px;
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #d9534f; flex-shrink: 0;
  }
  #dot.connected { background: #5cb85c; }
  #label { color: var(--tg-theme-text-color, #eee); font-weight: 600; }
  #term-wrap { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; }
  #terminal { height: 100%; width: 100%; }
</style>
</head>
<body>

<div id="statusbar">
  <div id="dot"></div>
  <span id="label">connecting…</span>
</div>
<div id="term-wrap"><div id="terminal"></div></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // A terminal wants every pixel it can get.
  if (tg.requestFullscreen) tg.requestFullscreen();
  tg.disableVerticalSwipes?.();
}

// ---- Config: which backend, which server ----
// Swap this for your real deployed backend host before shipping.
const WS_BASE = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
const params = new URLSearchParams(location.search);
const serverId = params.get("server_id");

const dot = document.getElementById("dot");
const label = document.getElementById("label");

function setStatus(text, connected) {
  label.textContent = text;
  dot.classList.toggle("connected", !!connected);
}

if (!serverId) {
  setStatus("no server_id in URL", false);
} else {

  // ---- Terminal setup ----
  const term = new Terminal({
    convertEol: true,
    cursorBlink: true,
    fontFamily: "Menlo, Consolas, monospace",
    fontSize: 14,
    theme: {
      background: tg?.themeParams?.bg_color || "#0e0e0e",
      foreground: tg?.themeParams?.text_color || "#e6e6e6",
      cursor: tg?.themeParams?.button_color || "#5cb85c",
    },
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("terminal"));
  fitAddon.fit();

  // ---- Websocket wiring ----
  const ws = new WebSocket(`${WS_BASE}/ws/terminal/${encodeURIComponent(serverId)}`);

  ws.onopen = () => {
    setStatus("authenticating…", false);
    ws.send(JSON.stringify({
      type: "auth",
      init_data: tg?.initData || "",
      cols: term.cols,
      rows: term.rows,
    }));
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    switch (msg.type) {
      case "status":
        setStatus(msg.data, msg.data === "connected");
        break;
      case "output":
        term.write(msg.data);
        break;
      case "error":
        setStatus("error: " + msg.data, false);
        term.write(`\r\n\x1b[31m[error] ${msg.data}\x1b[0m\r\n`);
        break;
      case "closed":
        setStatus("disconnected", false);
        break;
      default:
        break;
    }
  };

  ws.onclose = () => setStatus("disconnected", false);
  ws.onerror = () => setStatus("connection error", false);

  // Keystrokes -> backend, byte for byte.
  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "input", data }));
    }
  });

  // Resize -> tell the remote PTY so full-screen apps (top, vim, htop) redraw correctly.
  function sendResize() {
    fitAddon.fit();
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
    }
  }
  window.addEventListener("resize", sendResize);
  tg?.onEvent?.("viewportChanged", sendResize);

  // Keepalive so idle proxies don't drop the socket.
  setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
  }, 25000);
}
</script>
</body>
</html>
